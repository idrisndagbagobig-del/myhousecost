<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyHouseCost App</title>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }
    .container {
      max-width: 400px;
      margin: auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #22c55e;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      font-size: 20px;
      color: #38bdf8;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>MyHouseCost</h1>
<h1>Estimate Your Building Cost in Nigeria (Accurate 2026 Prices)</h1>
<p>Get a detailed cost breakdown for your house project in seconds.</p>
  <input type="text" id="project" placeholder="Project Name">

  <select id="location">
    <option value="lagos">Lagos</option>
    <option value="abuja">Abuja</option>
    <option value="ibadan">Ibadan</option>
    <option value="kano">Kano</option>
  </select>

  <select id="type">
    <option value="basic">Basic</option>
    <option value="standard">Standard</option>
    <option value="luxury">Luxury</option>
  </select>

  <input type="number" id="size" placeholder="Size (sqm)">

  <button onclick="calculateCost()">Calculate Cost</button>

  <div class="result" id="result"></div>

  <button id="unlockBtn" style="display:none; margin-top:10px;">
    Unlock Full Building Cost Report (₦1,000)
  </button>

  <div id="fullReport" style="display:none; margin-top:20px; text-align:left;"></div>
  <button id="downloadBtn" style="display:none; margin-top:10px;">
  Download Full Report (PDF)
</button>
</div>

<p>🏗️ Based on real Nigerian construction market data</p>
<p>₦ Updated material prices</p>
<p>🏚️ Trusted by builders & homeowners</p>

<!-- Load your data -->
<script src="data.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
  document.getElementById("downloadBtn").onclick = function () {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  const report = document.getElementById("fullReport").innerText;

  doc.setFontSize(14);
  doc.text("MyHouseCost Report", 10, 10);

  doc.setFontSize(10);
  doc.text(report, 10, 20);

  doc.save("building-cost-report.pdf");
};

function calculateCost() {
  const size = parseFloat(document.getElementById("size").value);
  const type = document.getElementById("type").value;
  const location = document.getElementById("location").value;

  // Check input
  if (!size || size <= 0) {
    alert("Please enter a valid size");
    return;
  }

  // Check data exists
  if (!data || !data.buildingTypes || !data.locations) {
    alert("Data not loaded. Check data.js file.");
    return;
  }

  const costPerSqm = data.buildingTypes[type];
  const multiplier = data.locations[location];

  if (!costPerSqm || !multiplier) {
    alert("Invalid selection");
    return;
  }

  const total = size * costPerSqm * multiplier;

  document.getElementById("result").innerHTML = `
    <h2>Estimated Project Cost</h2>
    <p style="font-size: 24px; font-weight: bold;">
      ₦${total.toLocaleString()}
    </p>
    <p style="color: gray;">
      Detailed breakdown available after unlock
    </p>
  `;

  // Add dynamic breakdown (IMPORTANT UPGRADE)
  document.getElementById("fullReport").innerHTML = `
    <h3>Full Cost Breakdown</h3>
    <p>Foundation: ₦${(total * 0.2).toLocaleString()}</p>
    <p>Structure: ₦${(total * 0.3).toLocaleString()}</p>
    <p>Roofing: ₦${(total * 0.15).toLocaleString()}</p>
    <p>Finishing: ₦${(total * 0.25).toLocaleString()}</p>
  `;

  document.getElementById("unlockBtn").style.display = "block";
  document.getElementById("fullReport").style.display = "none";
  checkPaymentUnlock();
}


// Payment + redirect
document.getElementById("unlockBtn").onclick = function () {
  fetch("https://myhousecost.onrender.com/pay", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      email: "test@email.com",
      amount: 1000
    })
  })
  .then(res => res.json())
  .then(data => {
    if (!data.status || !data.data) {
      alert("Payment error: " + JSON.stringify(data.message));
      return;
    }

    window.location.href = data.data.authorization_url;
  })
  .catch(err => {
    console.error(err);
    alert("Payment failed: " + err.message);
  });
};
// Auto unlock after payment
function checkPaymentUnlock() {
  if (localStorage.getItem("paid") === "true") {
    document.getElementById("unlockBtn").style.display = "none";

    // Only show report if it exists
    if (document.getElementById("fullReport").innerHTML !== "") {
      document.getElementById("fullReport").style.display = "block";
      document.getElementById("downloadBtn").style.display = "block";
    }
  }
}
window.onload = checkPaymentUnlock;
</script>

</body>
</html>
